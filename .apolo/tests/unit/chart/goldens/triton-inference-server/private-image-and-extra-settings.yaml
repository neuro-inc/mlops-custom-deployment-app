              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            successThreshold: 1
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /v2/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
          resources:
            limits:
              cpu: 1000.0m
              memory: 4096M
            requests:
              cpu: 1000.0m
              memory: 4096M
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - emptyDir:
            medium: Memory
          name: dshm
      affinity:
