              type: RuntimeDefault
          image: "nginx:1.27"
          env:
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
              name: http
          resources:
            limits:
              cpu: 1000.0m
              memory: 4096M
            requests:
              cpu: 1000.0m
              memory: 4096M
