      volumes:
        - configMap:
            name: app-release-configmap
          name: app-release-configmap
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: platform.neuromation.io/nodepool
                operator: In
                values:
                - cpu_pool
      tolerations:
        - effect: NoSchedule
          key: platform.neuromation.io/job
