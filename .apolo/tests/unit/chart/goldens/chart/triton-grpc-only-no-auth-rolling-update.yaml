# Source: custom-deployment/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-b1aeaf654526474ba22480d00e5b0109
  labels:
    application: triton
    helm.sh/chart: custom-deployment-0.1.0
    platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
    app.kubernetes.io/name: custom-deployment
    app.kubernetes.io/instance: test-org-test-project-triton-b1aeaf65
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  progressDeadlineSeconds: 1000000
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: custom-deployment
      app.kubernetes.io/instance: test-org-test-project-triton-b1aeaf65
      module: main-app
  template:
    metadata:
      annotations:
        
        platform.apolo.us/inject-storage: '[{"storage_uri": "storage://cluster/test-org/test-project/triton/models",
          "mount_path": "/models", "mount_mode": "r"}]'
      labels:
        application: triton
        helm.sh/chart: custom-deployment-0.1.0
        platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
        app.kubernetes.io/name: custom-deployment
        app.kubernetes.io/instance: test-org-test-project-triton-b1aeaf65
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        module: main-app
        platform.apolo.us/inject-storage: "true"
        platform.apolo.us/org: test-org
        platform.apolo.us/project: test-project
        platform.apolo.us/preset: gpu-small
        platform.apolo.us/component: app
    spec:
      securityContext:
        {}
      containers:
        - name: custom-deployment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          image: "nvcr.io/nvidia/tritonserver:26.10-py3"
          env:
              - name: HF_TOKEN
                
                valueFrom:
                  secretKeyRef:
                    key: hf-token
                    name: apps-secrets
          imagePullPolicy: IfNotPresent
          args:
            - tritonserver
            - --model-repository=/models
            - --http-port=8000
            - --grpc-port=8001
            - --metrics-port=8002
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
            - containerPort: 8001
              protocol: TCP
              name: grpc
            - containerPort: 8002
              protocol: TCP
              name: metrics
          livenessProbe:
            failureThreshold: 9
            httpGet:
              path: /v2/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            successThreshold: 1
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /v2/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
          resources:
            {}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - emptyDir:
            medium: Memory
          name: dshm
