apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-org-test-project-openwebui-b1aeaf65-custom-deployment
  labels:
    application: openwebui
    helm.sh/chart: custom-deployment-0.1.0
    platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
    app.kubernetes.io/name: custom-deployment
    app.kubernetes.io/instance: test-org-test-project-openwebui-b1aeaf65
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: custom-deployment
      app.kubernetes.io/instance: test-org-test-project-openwebui-b1aeaf65
      module: main-app
  template:
    metadata:
      annotations:
        
        platform.apolo.us/inject-storage: '[{"storage_uri": "storage://cluster/test-org/test-project/.apps/openwebui/test-org-test-project-openwebui-b1aeaf65",
          "mount_path": "/app/backend/data", "mount_mode": "rw"}]'
      labels:
        application: openwebui
        helm.sh/chart: custom-deployment-0.1.0
        platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
        app.kubernetes.io/name: custom-deployment
        app.kubernetes.io/instance: test-org-test-project-openwebui-b1aeaf65
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        module: main-app
        platform.apolo.us/inject-storage: "true"
        platform.apolo.us/org: test-org
        platform.apolo.us/project: test-project
        platform.apolo.us/preset: cpu-small
        platform.apolo.us/component: app
    spec:
      securityContext:
        {}
      containers:
        - name: custom-deployment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/open-webui/open-webui:git-b5f4c85"
          env:
              - name: OPENAI_API_BASE_URL
                value: "http://llm-inference.platform--org--project/v1"
              - name: RAG_EMBEDDING_ENGINE
                value: "openai"
              - name: RAG_OPENAI_API_BASE_URL
                value: "http://tei.platform--org--project:3000/v1"
              - name: RAG_EMBEDDING_MODEL
                value: "BAAI/bge-small-en-v1.5"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          livenessProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
          resources:
            limits:
              cpu: 1000.0m
              memory: 4096M
            requests:
              cpu: 1000.0m
              memory: 4096M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: platform.neuromation.io/nodepool
                operator: In
                values:
                - cpu_pool
      tolerations:
        - effect: NoSchedule
          key: platform.neuromation.io/job
          operator: Exists
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
