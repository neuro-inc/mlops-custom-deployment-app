# Source: custom-deployment/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-org-test-project-shell-b1aeaf65-custom-deployment
  labels:
    application: shell
    helm.sh/chart: custom-deployment-0.1.0
    platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
    app.kubernetes.io/name: custom-deployment
    app.kubernetes.io/instance: test-org-test-project-shell-b1aeaf65
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: custom-deployment
      app.kubernetes.io/instance: test-org-test-project-shell-b1aeaf65
      module: main-app
  template:
    metadata:
      annotations:
        
        platform.apolo.us/inject-storage: '[{"storage_uri": "storage://cluster/test-org/test-project/.apps/shell/test-org-test-project-shell-b1aeaf65",
          "mount_path": "/var/storage", "mount_mode": "rw"}]'
      labels:
        application: shell
        helm.sh/chart: custom-deployment-0.1.0
        platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
        app.kubernetes.io/name: custom-deployment
        app.kubernetes.io/instance: test-org-test-project-shell-b1aeaf65
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        module: main-app
        platform.apolo.us/inject-storage: "true"
        platform.apolo.us/org: test-org
        platform.apolo.us/project: test-project
        platform.apolo.us/preset: cpu-small
        platform.apolo.us/component: app
    spec:
      securityContext:
        {}
      containers:
        - name: custom-deployment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/neuro-inc/web-shell:pipelines"
          env:
              - name: NEURO_EVENT_CATEGORY
                value: "WEB-CLI"
              - name: NEURO_CLI_DISABLE_PYPI_VERSION_CHECK
                value: "yes"
              - name: WORKDIR
                value: "/var/storage"
              - name: TERM
                value: "xterm-256color"
              - name: LANG
                value: "C.utf8"
              - name: NEURO_PASSED_CONFIG
                value: "eyJ0b2tlbiI6ICJ0ZXN0LXRva2VuIn0="
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7681
              protocol: TCP
              name: http
          livenessProbe:
            failureThreshold: 20
            httpGet:
              path: /
              port: 7681
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /
              port: 7681
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
          resources:
            limits:
              cpu: 1000.0m
              memory: 4096M
            requests:
              cpu: 1000.0m
              memory: 4096M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: platform.neuromation.io/nodepool
                operator: In
                values:
                - cpu_pool
      tolerations:
        - effect: NoSchedule
          key: platform.neuromation.io/job
          operator: Exists
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
