# Source: custom-deployment/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-release-custom-deployment
  labels:
    application: mlflow
    helm.sh/chart: custom-deployment-0.1.0
    platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
    app.kubernetes.io/name: custom-deployment
    app.kubernetes.io/instance: app-release
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: custom-deployment
      app.kubernetes.io/instance: app-release
      module: main-app
  template:
    metadata:
      annotations:
        
        platform.apolo.us/inject-storage: '[{"storage_uri": "storage://cluster/test-org/test-project/mlflow-artifacts",
          "mount_path": "/mlflow-artifacts", "mount_mode": "rw"}]'
      labels:
        application: mlflow
        helm.sh/chart: custom-deployment-0.1.0
        platform.apolo.us/app-id: "b1aeaf654526474ba22480d00e5b0109"
        app.kubernetes.io/name: custom-deployment
        app.kubernetes.io/instance: app-release
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        module: main-app
        platform.apolo.us/inject-storage: "true"
        platform.apolo.us/org: test-org
        platform.apolo.us/project: test-project
        platform.apolo.us/preset: cpu-small
        platform.apolo.us/component: app
    spec:
      securityContext:
        {}
      containers:
        - name: custom-deployment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/apolo-actions/mlflow:v3.15.1"
          env:
              - name: MLFLOW_TRACKING_URI
                
                valueFrom:
                  secretKeyRef:
                    key: pgvector_pgbouncer_uri
                    name: apps-secrets
              - name: MLFLOW_SERVER_ALLOWED_HOSTS
                value: "localhost,127.0.0.1,[::1],0.0.0.0,localhost:*,127.0.0.1:*,[[]::1]:*,0.0.0.0:*,192.168.*,10.*,172.16.*,172.17.*,172.18.*,172.19.*,172.20.*,172.21.*,172.22.*,172.23.*,172.24.*,172.25.*,172.26.*,172.27.*,172.28.*,172.29.*,172.30.*,172.31.*,fc00:*,fd00:*,*.platform--test-org--test-project,*.platform--test-org--test-project:*,*.platform--test-org--test-project.svc,*.platform--test-org--test-project.svc:*,*.platform--test-org--test-project.svc.cluster.local,*.platform--test-org--test-project.svc.cluster.local:*,mlflow--b1aeaf654526474ba22480d00e5b0109.apps.some.org.neu.ro,mlflow--b1aeaf654526474ba22480d00e5b0109.apps.some.org.neu.ro:*"
              - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
                value: "https://mlflow--b1aeaf654526474ba22480d00e5b0109.apps.some.org.neu.ro,http://mlflow--b1aeaf654526474ba22480d00e5b0109.apps.some.org.neu.ro"
              - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
                value: "false"
              - name: MLFLOW_ARTIFACT_ROOT
                value: "file:///mlflow-artifacts"
          imagePullPolicy: IfNotPresent
          command:
            - mlflow
          args:
            - server
            - --serve-artifacts
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=key='pgvector_pgbouncer_uri'
            - --artifacts-destination=/mlflow-artifacts
          ports:
            - containerPort: 5000
              protocol: TCP
              name: http
          livenessProbe:
            failureThreshold: 20
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
          resources:
            limits:
              cpu: 1000.0m
              memory: 4096M
            requests:
              cpu: 1000.0m
              memory: 4096M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: platform.neuromation.io/nodepool
                operator: In
                values:
                - cpu_pool
      tolerations:
        - effect: NoSchedule
          key: platform.neuromation.io/job
          operator: Exists
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
