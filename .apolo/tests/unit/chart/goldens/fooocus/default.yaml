  template:
    metadata:
      annotations:
        
        platform.apolo.us/inject-storage: '[{"storage_uri": "storage://cluster/test-org/test-project/.apps/fooocus/test-org-test-project-fooocus-b1aeaf65/data",
          "mount_path": "/content/data", "mount_mode": "rw"}, {"storage_uri": "storage://cluster/test-org/test-project/.apps/fooocus/test-org-test-project-fooocus-b1aeaf65/app/outputs",
          "mount_path": "/content/app/outputs", "mount_mode": "rw"}]'
      labels:
