        app.kubernetes.io/name: custom-deployment
        app.kubernetes.io/instance: test-org-test-project-fooocus-b1aeaf65
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        module: main-app
        platform.apolo.us/inject-storage: "true"
        platform.apolo.us/org: test-org
        platform.apolo.us/project: test-project
        platform.apolo.us/preset: gpu-small
        platform.apolo.us/component: app
    spec:
      securityContext:
        {}
      containers:
        - name: custom-deployment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/neuro-inc/fooocus:latest"
          env:
              - name: CMDARGS
                value: "--listen"
              - name: DATADIR
                value: "/content/data"
