            httpGet:
              path: /
              port: 7865
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /
              port: 7865
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
          resources:
            limits:
              cpu: 4000.0m
              memory: 16384M
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000.0m
              memory: 16384M
              nvidia.com/gpu: "1"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: platform.neuromation.io/nodepool
                operator: In
                values:
                - gpu_pool
      tolerations:
        - effect: NoSchedule
