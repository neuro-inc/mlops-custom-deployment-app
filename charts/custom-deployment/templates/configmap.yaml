{{- if .Values.configMap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "configMap.name is required when configMap.enabled is true" .Values.configMap.name }}
  labels:
    {{- include "custom-deployment.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end -}}
